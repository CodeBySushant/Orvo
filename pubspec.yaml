name: orvo
description: "Orvo — a premium offline music player."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  audio_session: ^0.1.23
  on_audio_query_pluse: ^3.0.7
  permission_handler: ^11.3.1
  palette_generator: ^0.3.3+5
  shared_preferences: ^2.3.3
  sqflite: ^2.3.3
  path: ^1.9.0
  flutter_animate: ^4.5.0
  device_info_plus: ^13.2.0
  dynamic_color: ^1.7.0
  quick_actions: ^1.0.7
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # App icon generation (run: dart run flutter_launcher_icons)
  flutter_launcher_icons: ^0.14.3

# FEATURE: custom launcher icon from assets/icons/icon1.png.
# Regenerates every mipmap density + the Android 8+ adaptive icon.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon1.png"
  min_sdk_android: 21
  adaptive_icon_background: "#12101F"
  adaptive_icon_foreground: "assets/icons/icon1.png"

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
